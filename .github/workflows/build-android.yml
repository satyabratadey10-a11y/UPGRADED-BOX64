name: Build Box64 for Android ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -D ARM64=1 -D ANDROID=1 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNOGIT=1

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Package WCP for Winlator
        run: |
          mkdir -p wcp_package/usr/bin
          cp build/box64 wcp_package/usr/bin/box64
          cd wcp_package
          zip -r ../box64-upgraded.wcp .

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-arm64-android
          path: build/box64

      - name: Upload WCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-upgraded-wcp
          path: box64-upgraded.wcp
