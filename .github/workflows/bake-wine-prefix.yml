name: Bake Wine Prefix for Termux Testing

on:
  workflow_dispatch:

jobs:
  bake:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Wine (Kron4ek 9.0 amd64 matching Termux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          mkdir -p /opt/wine-9.0
          wget -q "https://github.com/Kron4ek/Wine-Builds/releases/download/9.0/wine-9.0-amd64.tar.xz" \
            -O /tmp/wine.tar.xz
          tar -xf /tmp/wine.tar.xz -C /opt/wine-9.0 --strip-components=1
          echo "/opt/wine-9.0/bin" >> $GITHUB_PATH
          export PATH="/opt/wine-9.0/bin:$PATH"
          wine64 --version

      - name: Bake minimal Wine prefix
        run: |
          export WINEPREFIX=$HOME/wine-prefix
          export WINEARCH=win64
          export WINEDLLOVERRIDES="mscoree,mshtml,winemenubuilder.exe=d"
          export WINEDEBUG=-all
          export DISPLAY=""
          wineboot --init
          wineserver -w
          echo "Prefix size: $(du -sh $WINEPREFIX | cut -f1)"

      - name: Install Geany into prefix
        run: |
          export WINEPREFIX=$HOME/wine-prefix
          export WINEDEBUG=-all
          export DISPLAY=""
          wget -q "https://download.geany.org/geany-2.1_setup.exe" \
            -O /tmp/geany_setup.exe
          7z x /tmp/geany_setup.exe -o/tmp/geany-files 2>&1 | tail -3
          mkdir -p "$WINEPREFIX/drive_c/Program Files/Geany"
          cp -r /tmp/geany-files/* \
            "$WINEPREFIX/drive_c/Program Files/Geany/" 2>/dev/null || true
          find $WINEPREFIX -name "libiconv-2.dll" | head -3
          find $WINEPREFIX -name "geany.exe" | head -3

      - name: Compress prefix with 7z ultra
        run: |
          cd $HOME
          7z a -t7z -m0=lzma2 -mx=9 -mfb=273 -ms=on /tmp/wine-prefix-geany.7z wine-prefix/
          ls -lh /tmp/wine-prefix-geany.7z

      - name: Upload prefix artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-geany
          path: /tmp/wine-prefix-geany.7z

      - name: Upload Geany files separately
        uses: actions/upload-artifact@v4
        with:
          name: geany-files
          path: /tmp/geany-files/
